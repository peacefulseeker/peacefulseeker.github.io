name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm playwright install chromium --with-deps
      - run: pnpm test:integration

  # Build validation, required by the branch ruleset. PRs only: on main push
  # the deploy workflow already builds the artifact, so this would be redundant.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm build
