name: Deploy to GitHub Pages

# Deploy runs on main push only. PR build validation lives in ci.yml (the
# required `build` check), so there is no PR trigger or paths filter here.
# Both build jobs share the ./.github/actions/setup composite action.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize deploys: never race each other on main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    # Main-only (workflow_dispatch can fire from any branch); owner check guards
    # against unexpected deploys if a collaborator is ever added.
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'peacefulseeker'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
