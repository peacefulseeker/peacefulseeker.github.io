name: Deploy to GitHub Pages

# Deploy is gated on CI. It triggers via workflow_run after the CI workflow
# finishes on main, and only proceeds when that run succeeded — so quality
# (format/typecheck/test/integration) must pass before we build and deploy.
# workflow_dispatch allows a manual redeploy of the current main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize deploys: never race each other on main, and never cancel an
# in-progress deploy (unlike CI, which cancels superseded runs).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Gate: main-only + owner guard + CI succeeded. workflow_dispatch carries no
    # workflow_run payload, so it is allowed through the conclusion check.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository_owner == 'peacefulseeker' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
