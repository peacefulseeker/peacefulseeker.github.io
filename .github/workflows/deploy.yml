name: Deploy to GitHub Pages

# Deploy runs on main push only. PR build validation lives in ci.yml (the
# required `build` check), so there is no PR trigger or paths filter here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys: never race each other on main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          # Pin mise: installing "latest" intermittently 404s when mise's
          # VERSION endpoint advertises a release before its binaries publish.
          version: 2026.6.11
      - name: Resolve pnpm store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    # Main-only (workflow_dispatch can fire from any branch); owner check guards
    # against unexpected deploys if a collaborator is ever added.
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'peacefulseeker'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
