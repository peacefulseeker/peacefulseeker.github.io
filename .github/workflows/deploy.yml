name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "astro.config.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "mise.toml"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "astro.config.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "mise.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize per-ref: main deploys never race each other, PR validations stay independent.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          # Pin mise: installing "latest" intermittently 404s when mise's
          # VERSION endpoint advertises a release before its binaries publish.
          version: 2026.6.11
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    # Only the default branch deploys; PR runs stop after build validation.
    # Owner check guards against unexpected deploys if a collaborator is ever added.
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'peacefulseeker'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
